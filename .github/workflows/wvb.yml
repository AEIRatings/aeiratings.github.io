name: Daily wvb Scores and ELO Update

on:
  schedule:
    # Runs once a day at 10:50 AM UTC (6:50 AM ET), after the other daily
    # score/ELO jobs.
    - cron: '50 10 * * *'

  # Also allow manual running via the GitHub Actions tab
  workflow_dispatch:

jobs:
  get_scores:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run getWVBscores Script
        run: |
          echo "Running getWVBscores.py to retrieve latest set-by-set results..."
          python getWVBscores.py

      - name: Upload Scores Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wvb-scores-data
          path: wvb_scores_previous_day.csv

  update_elo:
    runs-on: ubuntu-latest
    needs: [get_scores]

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Scores Artifact
        uses: actions/download-artifact@v4
        with:
          name: wvb-scores-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run ELO Updater Script
        run: |
          echo "Running elo_updater_wvb.py to replay each match set-by-set..."
          python elo_updater_wvb.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Daily wvb ELO Update: New set-by-set scores and ratings"
          file_pattern: data/wvb.csv
          commit_author: 'GitHub Actions Bot <action@github.com>'
          skip_dirty_check: true
