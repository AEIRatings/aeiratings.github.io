name: Backfill mcbb/wcbb ELO Ratings

# Manual-only: rebuilds data/<league>.csv from data/<league>_preseason.csv by
# replaying every game from start_date through end_date with backfill_cbb.py.
on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League to rebuild'
        required: true
        type: choice
        options: [mcbb, wcbb]
      start_date:
        description: 'First date to replay (YYYY-MM-DD, inclusive)'
        required: true
        default: '2026-11-01'
      end_date:
        description: 'Last date to replay (YYYY-MM-DD, inclusive; blank = yesterday)'
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Backfill Script
        run: |
          if [ -n "${{ inputs.end_date }}" ]; then END="--end ${{ inputs.end_date }}"; fi
          python backfill_cbb.py --league "${{ inputs.league }}" --start "${{ inputs.start_date }}" $END

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Backfill ${{ inputs.league }} ELO ratings from ${{ inputs.start_date }}"
          file_pattern: data/${{ inputs.league }}.csv data/${{ inputs.league }}_last_update.txt
          commit_author: 'GitHub Actions Bot <action@github.com>'
