name: Daily wcbb Scores and ELO Update

on:
  schedule:
    # Runs once a day at 10:20 UTC (5-6 AM Eastern)
    - cron: '20 10 * * *'

  # Also allow manual running via the GitHub Actions tab
  workflow_dispatch:

jobs:
  update_elo:
    runs-on: ubuntu-latest
    # Needs write permission to commit and push the updated files
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Fetch Scores Since Last Update
        # Fetches every day after data/wcbb_last_update.txt through yesterday,
        # so a missed run is caught up automatically.
        run: python getWCBBscores.py

      - name: Run ELO Updater Script
        run: python elo_updater_wcbb.py

      - name: Upload Scores Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wcbb-scores-data
          path: wcbb_scores_previous_day.csv

      - name: Commit and Push Changes
        # No skip_dirty_check: on days with no games nothing changes and the
        # step succeeds without committing, instead of failing the run.
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Daily wcbb ELO Update: New scores and ratings"
          file_pattern: data/wcbb.csv data/wcbb_last_update.txt
          commit_author: 'GitHub Actions Bot <action@github.com>'
